name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release and uploads assets
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/checksum.sh dist/psnpp-gist-sync.user.js dist/psnpp-gist-sync.meta.js

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --notes-file release_notes.md dist/psnpp-gist-sync.user.js dist/psnpp-gist-sync.meta.js dist/psnpp-gist-sync.user.js.sha256 dist/psnpp-gist-sync.meta.js.sha256
