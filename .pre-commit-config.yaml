fail_fast: true

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 0
      - id: mixed-line-ending
        args: [--fix=lf]
        priority: 0

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        priority: 0

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273  # frozen: v3.9.10
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.8.3
          - prettier-plugin-packagejson@3.1.0
        types_or: [ts, javascript, json, yaml]
        priority: 2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        priority: 2

  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: bunx tsc
        language: system
        types_or: [ts, javascript]
        pass_filenames: false
        priority: 1

      - id: eslint
        name: eslint
        entry: bunx eslint
        language: system
        types_or: [ts, javascript]
        priority: 1
